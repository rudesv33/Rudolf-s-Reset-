<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rudolf's Reset - Quote Request</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
        button { margin-top: 20px; padding: 10px 20px; background-color: #0056b3; color: white; border: none; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #004494; }
    </style>
</head>
<body>

    <h1>Request a Quote - Rudolf's Reset</h1>
    <p>Enter your details and upload photos below for A and R Pristine Cleaning.</p>

    <form ​<form name="quote-request" method="POST" data-netlify="true" enctype="multipart/form-data" action="/">
        
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" required>

        <label for="details">Job Details:</label>
        <textarea id="details" name="details" rows="4" required></textarea>

        <label for="photos">Upload Photos:</label>
        <input type="file" id="photos" name="photos" accept="image/*" multiple required>

        <button type="submit">Submit Request</button>
        
    </form>

</body>
</html>
