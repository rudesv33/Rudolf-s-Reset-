<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rudolf's Reset</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; color: #333; }
        .logo { width: 150px; border-radius: 50%; margin-bottom: 20px; }
        h1 { color: #1e4d2b; }
        .form-container { max-width: 400px; margin: 0 auto; text-align: left; background: #f9f9f9; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        label { font-weight: bold; display: block; margin-top: 15px; }
        input, textarea, button { width: 100%; margin-top: 5px; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #558b6e; color: white; border: none; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

    <img src="logo.png" alt="Rudolf's Reset Logo" class="logo">
    
    <h1>Welcome to Rudolf's Reset</h1>
    <p>Premium cleaning and home improvement in Brisbane. We specialize in complete residential resets. Let us transform your space with our reliable, elite service!</p>

    <div class="form-container">
        <h2>Request a Quote</h2>
        <p>Send us details and photos, and we'll reply with a quote.</p>
        
        <form name="quote-request" method="POST" data-netlify="true" enctype="multipart/form-data" action="/success.html">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="photos">Upload Pictures of the Space:</label>
            <input type="file" id="photos" name="photos" multiple>

            <label for="help">What do you need help with?</label>
            <textarea id="help" name="message" rows="4" required></textarea>

            <button type="submit">Send Request</button>
        </form>
    </div>

</body>
</html>
